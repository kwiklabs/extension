<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kwik Send</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0;
    }

    .header {
      background: white;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
    }

    .header button {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      color: #6b7280;
    }

    .header button:hover {
      color: #111827;
    }

    .content {
      background: white;
      padding: 1.5rem;
    }

    .section {
      margin-bottom: 1.5rem;
    }

    .section.hidden {
      display: none;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .dropzone {
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
    }

    .dropzone:hover {
      border-color: #3b82f6;
      background: #f0f9ff;
    }

    .dropzone.dragging {
      border-color: #3b82f6;
      background: #dbeafe;
    }

    .dropzone-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .dropzone-text {
      font-size: 0.875rem;
      color: #6b7280;
    }

    .progress-container {
      padding: 1rem 0;
    }

    .progress-bar-bg {
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .result-container {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      padding: 1rem;
    }

    .result-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #166534;
      margin-bottom: 0.5rem;
    }

    .result-link {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .result-link input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: monospace;
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
      width: 100%;
      margin-top: 1rem;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .btn-success {
      background: #10b981 !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚀 Kwik Send</h1>
    <button id="settingsBtn">⚙️</button>
  </div>

  <div class="content">
    <!-- Upload Section -->
    <div id="uploadSection" class="section">
      <div>
        <label for="expires">Link expires in</label>
        <select id="expires">
          <option value="1h">1 hour</option>
          <option value="24h" selected>24 hours</option>
          <option value="7d">7 days</option>
          <option value="30d">30 days</option>
        </select>
      </div>

      <div>
        <label for="maxDownloads">Maximum downloads</label>
        <input type="number" id="maxDownloads" value="10" min="1" max="100">
      </div>

      <div id="dropzone" class="dropzone">
        <div class="dropzone-icon">📁</div>
        <div class="dropzone-text">Drop file or click to upload</div>
        <input type="file" id="fileInput" style="display: none;">
      </div>
    </div>

    <!-- Progress Section -->
    <div id="progressSection" class="section hidden">
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="progress-text">
          <span id="progressText">Encrypting 0%</span>
          <span id="progressDetails"></span>
        </div>
      </div>
    </div>

    <!-- Result Section -->
    <div id="resultSection" class="section hidden">
      <div class="result-container">
        <div class="result-title">✓ Upload complete</div>
        <div class="result-link">
          <input type="text" id="resultUrl" readonly>
          <button id="copyBtn" class="btn-secondary">Copy</button>
        </div>
      </div>
      <button id="newUploadBtn" class="btn-primary">New Upload</button>
    </div>
  </div>

  <script src="popup.global.js"></script>
</body>
</html>
